fragment HomepageParts on Homepage {
  __typename
  hero {
    __typename
    badge
    badgeBg
    badgeText
    headline
    headlineColor
    accent
    accentColor
    subtext
    subtextColor
    primaryCtaText
    primaryCtaLink
    primaryBtnBg
    primaryBtnText
    secondaryCtaText
    secondaryCtaLink
    secondaryBtnBorder
    secondaryBtnText
    backgroundImage
    overlayColor
    overlayOpacity
  }
  categories {
    __typename
    label
    labelColor
    title
    titleColor
    subtitle
    subtitleColor
    items {
      __typename
      title
      subtitle
      href
      bg
      image
    }
    sectionBg
    cardBg
    cardTitleColor
    cardSubColor
  }
  trust {
    __typename
    label
    labelColor
    title
    titleColor
    items {
      __typename
      icon
      title
      desc
    }
    sectionBg
    cardBg
    cardTitleColor
    cardDescColor
    iconColor
    iconBg
  }
  studio {
    __typename
    label
    labelColor
    title
    titleColor
    text
    textColor
    features
    featureIconColor
    featureTextColor
    ctaText
    ctaLink
    ctaBg
    ctaTextColor
    images
    sectionBg
  }
  cta {
    __typename
    label
    labelColor
    title
    titleColor
    subtitle
    subtitleColor
    primaryText
    primaryLink
    primaryBtnBg
    primaryBtnText
    secondaryText
    secondaryLink
    secondaryBtnBorder
    secondaryBtnText
    sectionBg
  }
}

fragment ProjectParts on Project {
  __typename
  title
  description
  category
  completionDate
  images
}

fragment ReviewParts on Review {
  __typename
  name
  location
  rating
  quote
}

fragment SettingsParts on Settings {
  __typename
  brandName
  goldColor
  phone
  email
  location
  whatsapp
  instagram
  facebook
  tiktok
  twitter
  pinterest
  footerBg
  footerTitleColor
  footerTextColor
  footerLinkColor
  footerSocialColor
  header {
    __typename
    logoText
    logoColor
    logoAr
    logoArColor
    navLinks {
      __typename
      label
      href
    }
    navLinkColor
    ctaLabel
    ctaBg
    ctaTextColor
    headerBg
  }
}
